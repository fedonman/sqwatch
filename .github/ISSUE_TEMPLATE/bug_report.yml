name: Bug Report
description: Report a bug or unexpected behavior in sqwatch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short. A one-line title like `<pane> keeps showing the old log after the file is truncated` plus the steps that get you there is enough.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is broken, in a sentence or two. Add the cause or a suggested fix if you know it.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: |
        The shortest path from launching `sqwatch` to seeing the problem. Name the keys you pressed, the filters you set, and the job state if it matters.
      placeholder: |
        1. Launch `sqwatch`
        2. Press ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: |
        What happened instead. Paste the error, the message from the flash bar, or the contents of the pane. A screenshot works too. No need to describe it in words.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: System Information
      description: |
        The sqwatch version and how you installed it (`cargo install --list | grep sqwatch`, a release binary, or a source checkout), your OS, your terminal emulator and `$TERM`, and the output of `squeue --version`. If the bug involves filters, columns or the layout, add the relevant file from `~/.config/sqwatch/`.
      render: shell
    validations:
      required: true
