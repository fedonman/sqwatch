[package]
name = "sqwatch"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for watching and managing SLURM job queues."
authors = ["Vyron Vasileiadis <hi@fedonman.com>"]
repository = "https://github.com/fedonman/sqwatch"
readme = "README.md"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.0", features = ["crossterm_0_29"] }
crossbeam = "0.8.4"
notify = "8.2.0"
color-eyre = "0.6.5"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
async-process = "2.5.0"
regex = "1.12.3"